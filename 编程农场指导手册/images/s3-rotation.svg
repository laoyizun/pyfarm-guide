<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="720" height="440" fill="#F9FAFB"/>

  <!-- 标题 -->
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#333">S3 订单 1 · 三色轮作田（3×3）</text>
  <text x="360" y="60" text-anchor="middle" font-size="13" fill="#64748B">按列轮种：列 0 胡萝卜 🥕 · 列 1 南瓜 🎃 · 列 2 向日葵 🌻</text>

  <!-- 网格 3×3，单元格 110×110，左上 (90, 100) -->
  <g transform="translate(90, 100)">
    <!-- 田底色（深色土壤） -->
    <rect width="330" height="330" fill="#7a5a32" rx="6"/>
    <!-- 三列不同色背景 -->
    <rect x="0"   y="0" width="110" height="330" fill="#c97f3a" opacity="0.55"/>
    <rect x="110" y="0" width="110" height="330" fill="#7e9c3a" opacity="0.55"/>
    <rect x="220" y="0" width="110" height="330" fill="#d4a83a" opacity="0.55"/>

    <!-- 网格线 -->
    <g stroke="#3a2a10" stroke-width="1.5" fill="none">
      <rect x="0" y="0" width="330" height="330" stroke-width="2"/>
      <line x1="110" y1="0" x2="110" y2="330"/>
      <line x1="220" y1="0" x2="220" y2="330"/>
      <line x1="0" y1="110" x2="330" y2="110"/>
      <line x1="0" y1="220" x2="330" y2="220"/>
    </g>

    <!-- 作物 emoji -->
    <g font-size="48" text-anchor="middle" dominant-baseline="central">
      <text x="55"  y="55">🥕</text>
      <text x="55"  y="165">🥕</text>
      <text x="55"  y="275">🥕</text>

      <text x="165" y="55">🎃</text>
      <text x="165" y="165">🎃</text>
      <text x="165" y="275">🎃</text>

      <text x="275" y="55">🌻</text>
      <text x="275" y="165">🌻</text>
      <text x="275" y="275">🌻</text>
    </g>

    <!-- 列标签 -->
    <g font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">
      <rect x="20"  y="-30" width="70" height="22" rx="11" fill="#c97f3a"/>
      <text x="55"  y="-15">x=0 胡</text>
      <rect x="130" y="-30" width="70" height="22" rx="11" fill="#7e9c3a"/>
      <text x="165" y="-15">x=1 南</text>
      <rect x="240" y="-30" width="70" height="22" rx="11" fill="#d4a83a"/>
      <text x="275" y="-15">x=2 向</text>
    </g>

    <!-- 行标签 -->
    <g font-size="11" fill="#fff" font-weight="600" font-family="ui-monospace, Menlo, monospace">
      <rect x="-30" y="40"  width="22" height="30" rx="4" fill="#3a2a10" opacity="0.6"/>
      <text x="-19" y="60"  text-anchor="middle">y=0</text>
      <rect x="-30" y="150" width="22" height="30" rx="4" fill="#3a2a10" opacity="0.6"/>
      <text x="-19" y="170" text-anchor="middle">y=1</text>
      <rect x="-30" y="260" width="22" height="30" rx="4" fill="#3a2a10" opacity="0.6"/>
      <text x="-19" y="280" text-anchor="middle">y=2</text>
    </g>
  </g>

  <!-- 右侧说明 -->
  <g transform="translate(470, 100)">
    <rect width="220" height="320" fill="#fff" stroke="#EDEDED" rx="10"/>
    <text x="20" y="30" font-size="14" font-weight="700" fill="#F3A21C">🟧 一行代码顶三个 if</text>

    <text x="20" y="60" font-size="12" font-weight="600" fill="#333">crops 列表：</text>
    <rect x="20" y="68" width="180" height="44" rx="6" fill="#1f1f1f"/>
    <text x="28" y="86" font-size="9.5" fill="#e8e8e8" font-family="ui-monospace, Menlo, monospace">[胡萝卜, 南瓜, 向日葵]</text>
    <text x="28" y="102" font-size="9.5" fill="#7a8" font-family="ui-monospace, Menlo, monospace">  ↑ 索引 0   1      2</text>

    <text x="20" y="138" font-size="12" font-weight="600" fill="#F3A21C">🟧 关键代码：</text>
    <rect x="20" y="146" width="180" height="40" rx="6" fill="#1f1f1f"/>
    <text x="28" y="170" font-size="10.5" fill="#e8e8e8" font-family="ui-monospace, Menlo, monospace">plant(crops[x % len(crops)])</text>

    <text x="20" y="208" font-size="12" font-weight="600" fill="#F3A21C">🟧 加一种作物怎么改？</text>
    <text x="20" y="228" font-size="11" fill="#333">列表加一项就行：</text>
    <text x="20" y="248" font-size="11" fill="#333">crops = [胡, 南, 向, 仙人掌]</text>
    <text x="20" y="268" font-size="11" font-weight="600" fill="#3a6b3a">✓ 不动循环代码</text>
    <text x="20" y="288" font-size="11" font-weight="600" fill="#3a6b3a">✓ 4 列轮作，零修改</text>
  </g>
</svg>
