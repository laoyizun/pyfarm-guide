<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="720" height="440" fill="#F9FAFB"/>

  <!-- 标题 -->
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#333">特殊订单 1 · 大南瓜田（4×4 示意）</text>
  <text x="360" y="57" text-anchor="middle" font-size="12.5" fill="#64748B">整片种满南瓜 🎃，其中几格枯死成烂瓜 🖤，坏格必须重新补种</text>

  <!-- 4×4 网格：单元格 88×88，左上角 (120, 95)，原点在左下角 -->
  <g transform="translate(120, 95)">
    <!-- 田底色 -->
    <rect width="352" height="352" fill="#7a5a32" rx="6"/>

    <!-- 网格线 -->
    <g stroke="#3a2a10" stroke-width="1.4" fill="none">
      <rect x="0" y="0" width="352" height="352" stroke-width="2"/>
      <line x1="88"  y1="0" x2="88"  y2="352"/>
      <line x1="176" y1="0" x2="176" y2="352"/>
      <line x1="264" y1="0" x2="264" y2="352"/>
      <line x1="0" y1="88"  x2="352" y2="88"/>
      <line x1="0" y1="176" x2="352" y2="176"/>
      <line x1="0" y1="264" x2="352" y2="264"/>
    </g>

    <!-- 好南瓜（16 格中 13 格）：坐标 (x,y)，y=0 在底行 -->
    <g font-size="34" text-anchor="middle" dominant-baseline="central">
      <!-- y=3 (顶行) -->
      <text x="44"  y="44">🎃</text>
      <text x="132" y="44">🎃</text>
      <text x="308" y="44">🎃</text>
      <!-- y=2 -->
      <text x="44"  y="132">🎃</text>
      <text x="132" y="132">🎃</text>
      <text x="220" y="132">🎃</text>
      <text x="308" y="132">🎃</text>
      <!-- y=1 -->
      <text x="44"  y="220">🎃</text>
      <text x="220" y="220">🎃</text>
      <text x="308" y="220">🎃</text>
      <!-- y=0 (底行) -->
      <text x="44"  y="308">🎃</text>
      <text x="132" y="308">🎃</text>
      <text x="220" y="308">🎃</text>
      <text x="308" y="308">🎃</text>
    </g>

    <!-- 烂瓜 3 格：(1,3) (2,1) (3,2) -->
    <g>
      <rect x="88"  y="0"   width="88" height="88" fill="#3a2a2a" opacity="0.55" rx="3"/>
      <rect x="176" y="176" width="88" height="88" fill="#3a2a2a" opacity="0.55" rx="3"/>
      <rect x="264" y="88"  width="88" height="88" fill="#3a2a2a" opacity="0.55" rx="3"/>
    </g>
    <g font-size="30" text-anchor="middle" dominant-baseline="central">
      <text x="132" y="44">🥀</text>
      <text x="220" y="220">🥀</text>
      <text x="308" y="132">🥀</text>
    </g>

    <!-- 坏格红色角标 -->
    <g fill="#e74c3c">
      <circle cx="174" cy="0"   r="7"/>
      <circle cx="262" cy="176" r="7"/>
      <circle cx="350" cy="88"  r="7"/>
    </g>

    <!-- 原点标记（左下角） -->
    <circle cx="0" cy="352" r="9" fill="#F3A21C" stroke="#fff" stroke-width="2"/>
    <text x="14" y="356" font-size="10.5" font-weight="700" fill="#8a6a2a" font-family="ui-monospace, Menlo, monospace">(0,0)</text>

    <!-- 底部 x 轴标签 -->
    <g font-size="11" fill="#8a6a2a" font-weight="600" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">
      <text x="44"  y="372">x=0</text>
      <text x="132" y="372">x=1</text>
      <text x="220" y="372">x=2</text>
      <text x="308" y="372">x=3</text>
    </g>

    <!-- 左侧 y 轴标签（y=0 在下） -->
    <g font-size="11" fill="#8a6a2a" font-weight="600" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">
      <text x="-16" y="312">y=0</text>
      <text x="-16" y="224">y=1</text>
      <text x="-16" y="136">y=2</text>
      <text x="-16" y="48">  y=3</text>
    </g>
  </g>

  <!-- 右侧说明 -->
  <g transform="translate(520, 95)">
    <rect width="180" height="352" fill="#fff" stroke="#EDEDED" rx="10"/>

    <text x="16" y="26" font-size="13" font-weight="700" fill="#F3A21C">🟧 一个烂格就毁了</text>
    <text x="16" y="46" font-size="10.5" fill="#333">整片南瓜会聚合成一个</text>
    <text x="16" y="62" font-size="10.5" fill="#333">大南瓜，但只要有 1 格烂的，</text>
    <text x="16" y="78" font-size="10.5" fill="#333">就合不起来，只能收零碎小块。</text>

    <text x="16" y="112" font-size="13" font-weight="700" fill="#F3A21C">🟧 怎么认出烂瓜？</text>
    <text x="16" y="132" font-size="10.5" fill="#333">不用认！问一句就行：</text>
    <rect x="16" y="140" width="148" height="26" rx="5" fill="#1f1f1f"/>
    <text x="24" y="157" font-size="9.5" fill="#e8e8e8" font-family="ui-monospace, Menlo, monospace">can_harvest() == False</text>

    <text x="16" y="192" font-size="13" font-weight="700" fill="#F3A21C">🟧 好消息</text>
    <text x="16" y="212" font-size="10.5" fill="#333">在烂格上直接种南瓜，</text>
    <text x="16" y="228" font-size="10.5" fill="#333">它就被自动清掉了，</text>
    <text x="16" y="244" font-size="10.5" fill="#333">不用手动清理。</text>

    <text x="16" y="278" font-size="13" font-weight="700" fill="#F3A21C">🟧 难点</text>
    <text x="16" y="298" font-size="10.5" fill="#333">补种完的新南瓜</text>
    <text x="16" y="314" font-size="10.5" fill="#333">还没长熟，别急着收！</text>
    <text x="16" y="336" font-size="10" fill="#a05a4a">→ 见「思路拆解」第 4 步</text>
  </g>
</svg>
