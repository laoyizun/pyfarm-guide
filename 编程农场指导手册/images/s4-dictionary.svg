<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="720" height="440" fill="#F9FAFB"/>

  <!-- 标题 -->
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#333">S4 知识卡 ② · 字典 = 一张"谁想在哪儿种什么"的心愿单</text>
  <text x="360" y="57" text-anchor="middle" font-size="12.5" fill="#64748B">键是"在哪"，值是"种什么"—— 键不用连着，隔多远都查得到</text>

  <!-- 网格 5×4，单元格 68，左上 (40, 95)，原点在左下角 -->
  <g transform="translate(40, 95)">
    <rect width="340" height="272" fill="#8a6636" rx="6"/>
    <g stroke="#3a2a10" stroke-width="1.2" fill="none">
      <rect x="0" y="0" width="340" height="272" stroke-width="2"/>
      <line x1="68"  y1="0" x2="68"  y2="272"/>
      <line x1="136" y1="0" x2="136" y2="272"/>
      <line x1="204" y1="0" x2="204" y2="272"/>
      <line x1="272" y1="0" x2="272" y2="272"/>
      <line x1="0" y1="68"  x2="340" y2="68"/>
      <line x1="0" y1="136" x2="340" y2="136"/>
      <line x1="0" y1="204" x2="340" y2="204"/>
    </g>

    <!-- 伴生目标格高亮 -->
    <rect x="136" y="136" width="68" height="68" fill="#F3A21C" opacity="0.45" rx="3"/>
    <rect x="0"   y="0"   width="68" height="68" fill="#4e7c2a" opacity="0.45" rx="3"/>
    <rect x="272" y="68"  width="68" height="68" fill="#2d8b8b" opacity="0.40" rx="3"/>

    <!-- 发起请求的植株 -->
    <g font-size="28" text-anchor="middle" dominant-baseline="central">
      <text x="102" y="170">🌿</text>
      <text x="34"  y="102">🌿</text>
      <text x="238" y="102">🌳</text>
    </g>

    <!-- 伴生作物 -->
    <g font-size="28" text-anchor="middle" dominant-baseline="central">
      <text x="170" y="170">🥕</text>
      <text x="34"  y="34">🌳</text>
      <text x="306" y="102">🌿</text>
    </g>

    <!-- 编号徽标 -->
    <g text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#fff">
      <circle cx="150" cy="150" r="11" fill="#F3A21C"/>
      <text x="150" y="151">1</text>
      <circle cx="14"  cy="14"  r="11" fill="#4e7c2a"/>
      <text x="14"  y="15">2</text>
      <circle cx="306" cy="140" r="11" fill="#2d8b8b"/>
      <text x="306" y="141" font-size="12">3</text>
    </g>

    <!-- 请求箭头 -->
    <defs>
      <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#F3A21C"/>
      </marker>
      <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#4e7c2a"/>
      </marker>
      <marker id="arT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d8b8b"/>
      </marker>
    </defs>
    <path d="M 116 170 L 140 170" stroke="#F3A21C" stroke-width="2.6" marker-end="url(#arO)"/>
    <path d="M 34 86 L 34 52" stroke="#4e7c2a" stroke-width="2.6" marker-end="url(#arG)"/>
    <path d="M 252 102 L 266 102" stroke="#2d8b8b" stroke-width="2.6" marker-end="url(#arT)"/>

    <!-- 坐标：原点在左下 -->
    <circle cx="0" cy="272" r="8" fill="#F3A21C" stroke="#fff" stroke-width="2"/>
    <text x="16" y="262" font-size="10" font-weight="700" fill="#8a6a2a" font-family="ui-monospace, Menlo, monospace">(0,0)</text>
    <g font-size="9.5" fill="#8a6a2a" font-weight="600" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">
      <text x="34"  y="290">x=0</text>
      <text x="102" y="290">x=1</text>
      <text x="170" y="290">x=2</text>
      <text x="238" y="290">x=3</text>
      <text x="306" y="290">x=4</text>
    </g>
    <g font-size="9.5" fill="#8a6a2a" font-weight="600" font-family="ui-monospace, Menlo, monospace" text-anchor="end">
      <text x="-12" y="242">y=0</text>
      <text x="-12" y="174">y=1</text>
      <text x="-12" y="106">y=2</text>
      <text x="-12" y="38">y=3</text>
    </g>
  </g>

  <!-- 右侧：字典本身 -->
  <g transform="translate(415, 95)">
    <rect width="285" height="272" fill="#fff" stroke="#EDEDED" rx="10"/>

    <text x="16" y="26" font-size="13" font-weight="700" fill="#F3A21C">companions</text>
    <text x="100" y="26" font-size="10.5" fill="#64748B">心愿单</text>

    <!-- 表头 -->
    <text x="48" y="52" font-size="10.5" font-weight="700" fill="#8a6a2a" font-family="ui-monospace, Menlo, monospace">键（在哪）</text>
    <text x="140" y="52" font-size="10.5" font-weight="700" fill="#8a6a2a">值（种什么）</text>
    <line x1="16" y1="62" x2="269" y2="62" stroke="#EDEDED" stroke-width="1.5"/>

    <!-- 第 1 条 -->
    <circle cx="28" cy="88" r="11" fill="#F3A21C"/>
    <text x="28" y="89" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#fff">1</text>
    <text x="48" y="93" font-size="11.5" fill="#333" font-family="ui-monospace, Menlo, monospace">(2, 1)</text>
    <text x="140" y="93" font-size="12.5">🥕 胡萝卜</text>

    <!-- 第 2 条 -->
    <circle cx="28" cy="138" r="11" fill="#4e7c2a"/>
    <text x="28" y="139" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#fff">2</text>
    <text x="48" y="143" font-size="11.5" fill="#333" font-family="ui-monospace, Menlo, monospace">(0, 3)</text>
    <text x="140" y="143" font-size="12.5">🌳 树</text>

    <!-- 第 3 条 -->
    <circle cx="28" cy="188" r="11" fill="#2d8b8b"/>
    <text x="28" y="189" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#fff">3</text>
    <text x="48" y="193" font-size="11.5" fill="#333" font-family="ui-monospace, Menlo, monospace">(4, 2)</text>
    <text x="140" y="193" font-size="12.5">🌿 灌木</text>

    <!-- 底部说明 -->
    <rect x="16" y="210" width="253" height="52" rx="6" fill="#FFF8E8"/>
    <text x="26" y="227" font-size="10.5" fill="#a06a10">键<tspan font-weight="700">不用连着</tspan>：</text>
    <text x="88" y="227" font-size="10.5" fill="#a06a10">(0,3) 和 (2,1) 隔了一格</text>
    <text x="26" y="244" font-size="10.5" fill="#a06a10">也能各查各的 —— 列表做不到</text>
    <text x="26" y="258" font-size="10" font-weight="700" fill="#c2410c">遍历顺序 ≠ 写入顺序（字典无序）</text>
  </g>
</svg>
