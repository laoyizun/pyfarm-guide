<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <!-- 背景 -->
  <rect width="720" height="420" fill="#F9FAFB"/>

  <!-- 标题区 -->
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#333">S2 订单 1 · 棋盘格种植模板（3×3）</text>
  <text x="360" y="60" text-anchor="middle" font-size="13" fill="#64748B">黑格种树 🌳，白格种灌木 🌿 · 树不能相邻，棋盘格刚好错开</text>

  <!-- 网格参数：3×3，单元格 100×100，左上角 (110, 90)
       编程农场坐标：原点 (0,0) 在左下角，x 向右（East），y 向上（North） -->
  <g transform="translate(110, 90)">
    <!-- 田底色 -->
    <rect width="300" height="300" fill="#c9a36a" rx="4"/>
    <!-- 3×3 单元格 -->
    <g stroke="#5a3a1a" stroke-width="1.5" fill="none">
      <line x1="100" y1="0" x2="100" y2="300"/>
      <line x1="200" y1="0" x2="200" y2="300"/>
      <line x1="0" y1="100" x2="300" y2="100"/>
      <line x1="0" y1="200" x2="300" y2="200"/>
      <rect x="0" y="0" width="300" height="300" stroke-width="2"/>
    </g>

    <!-- 树木（黑格：x、y 奇偶性相同） -->
    <g font-size="44" text-anchor="middle" dominant-baseline="central">
      <text x="50"  y="250">🌳</text>
      <text x="150" y="150">🌳</text>
      <text x="250" y="50">🌳</text>
    </g>
    <!-- 灌木（白格：其余 6 格） -->
    <g font-size="40" text-anchor="middle" dominant-baseline="central" opacity="0.95">
      <text x="150" y="250">🌿</text>
      <text x="250" y="250">🌿</text>
      <text x="50"  y="150">🌿</text>
      <text x="50"  y="50">🌿</text>
      <text x="150" y="50">🌿</text>
      <text x="250" y="150">🌿</text>
    </g>

    <!-- 坐标轴：x 向右（底部标 0→2），y 向上（左侧标 0→2），原点 (0,0) 在左下角 -->
    <g font-size="11" fill="#5a3a1a" font-weight="600" font-family="ui-monospace, Menlo, monospace">
      <!-- 底部 x 轴标签 -->
      <text x="50"  y="318" text-anchor="middle">x=0</text>
      <text x="150" y="318" text-anchor="middle">x=1</text>
      <text x="250" y="318" text-anchor="middle">x=2</text>
      <!-- 左侧 y 轴标签（从下往上 0,1,2） -->
      <text x="-32" y="254" text-anchor="middle">y=0</text>
      <text x="-32" y="154" text-anchor="middle">y=1</text>
      <text x="-32" y="54"  text-anchor="middle">y=2</text>
    </g>

    <!-- 原点标记 -->
    <g>
      <circle cx="0" cy="300" r="9" fill="#F3A21C" stroke="#fff" stroke-width="2"/>
      <text x="0" y="336" text-anchor="middle" font-size="10.5" font-weight="700" fill="#F3A21C" font-family="ui-monospace, Menlo, monospace">(0,0)</text>
    </g>
  </g>

  <!-- 右侧说明 -->
  <g transform="translate(450, 100)">
    <rect x="0" y="0" width="230" height="280" fill="#fff" stroke="#EDEDED" rx="10"/>
    <text x="20" y="30" font-size="14" font-weight="700" fill="#F3A21C">🟧 怎么判断黑/白格？</text>
    <text x="20" y="62" font-size="12" fill="#333">x 和 y 的奇偶性相同 → 黑格（树）</text>
    <text x="20" y="84" font-size="12" fill="#333">x 和 y 的奇偶性不同 → 白格（灌木）</text>

    <text x="20" y="124" font-size="12" font-weight="600" fill="#F3A21C">判断条件：</text>
    <rect x="20" y="132" width="190" height="62" rx="6" fill="#1f1f1f"/>
    <text x="30" y="152" font-size="10.5" fill="#e8e8e8" font-family="ui-monospace, Menlo, monospace">(x%2==0 and y%2==0)</text>
    <text x="30" y="168" font-size="10.5" fill="#e8e8e8" font-family="ui-monospace, Menlo, monospace">or (x%2==1 and y%2==1)</text>
    <text x="30" y="186" font-size="10" fill="#7a8" font-family="ui-monospace, Menlo, monospace">→ 满足则 plant(Tree)</text>

    <text x="20" y="222" font-size="12" font-weight="600" fill="#F3A21C">🟧 易错点：</text>
    <text x="20" y="244" font-size="11" fill="#64748B">• x%2 只能是 0 或 1，别和 2 比</text>
    <text x="20" y="262" font-size="11" fill="#64748B">• and 优先级比 or 高，要加括号</text>
  </g>
</svg>
