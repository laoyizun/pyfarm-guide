<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="720" height="430" fill="#F9FAFB"/>

  <!-- 标题 -->
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#333">S8 订单 2 · 伴生链：同一个问题，小一号</text>
  <text x="360" y="57" text-anchor="middle" font-size="12.5" fill="#64748B">每一格问一次"你的伴生是什么"，问到没有为止 —— 这就是递归</text>

  <!-- 网格 4×2，单元格 96，左上 (50, 92)，原点在左下角 -->
  <g transform="translate(50, 92)">
    <rect width="384" height="192" fill="#8a6636" rx="6"/>
    <g stroke="#3a2a10" stroke-width="1.3" fill="none">
      <rect x="0" y="0" width="384" height="192" stroke-width="2"/>
      <line x1="96"  y1="0" x2="96"  y2="192"/>
      <line x1="192" y1="0" x2="192" y2="192"/>
      <line x1="288" y1="0" x2="288" y2="192"/>
      <line x1="0" y1="96" x2="384" y2="96"/>
    </g>

    <!-- 起点（右下角） -->
    <rect x="288" y="96" width="96" height="96" fill="#F3A21C" opacity="0.45" rx="3"/>
    <text x="336" y="144" font-size="34" text-anchor="middle" dominant-baseline="central">🌿</text>
    <text x="336" y="144" font-size="0">.</text>

    <!-- 链上的每一格 -->
    <rect x="192" y="96" width="96" height="96" fill="#d6884a" opacity="0.4" rx="3"/>
    <text x="240" y="144" font-size="32" text-anchor="middle" dominant-baseline="central">🥕</text>

    <rect x="96" y="0" width="96" height="96" fill="#4e7c2a" opacity="0.42" rx="3"/>
    <text x="144" y="48" font-size="32" text-anchor="middle" dominant-baseline="central">🌳</text>

    <!-- 链的尽头 -->
    <rect x="0" y="0" width="96" height="96" fill="#e8eef5" opacity="0.55" rx="3"/>
    <text x="48" y="40" font-size="28" text-anchor="middle" dominant-baseline="central">❓</text>
    <text x="48" y="70" font-size="11" font-weight="700" fill="#5b6b7d" text-anchor="middle">没有伴生</text>

    <!-- 递归箭头：从起点往上往左 -->
    <defs>
      <marker id="rO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#F3A21C"/>
      </marker>
      <marker id="rG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#4e7c2a"/>
      </marker>
    </defs>
    <path d="M 292 120 Q 266 96 288 96" fill="none" stroke="#F3A21C" stroke-width="3" marker-end="url(#rO)"/>
    <path d="M 196 120 Q 170 96 192 96" fill="none" stroke="#F3A21C" stroke-width="3" marker-end="url(#rO)"/>
    <path d="M 144 100 Q 120 76 142 76" fill="none" stroke="#4e7c2a" stroke-width="3" marker-end="url(#rG)"/>

    <!-- 递归层次标注 -->
    <g font-size="11" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">
      <circle cx="336" cy="176" r="13" fill="#a06a10"/>
      <text x="336" y="177">1</text>
      <circle cx="240" cy="176" r="13" fill="#a06a10"/>
      <text x="240" y="177">2</text>
      <circle cx="144" cy="80" r="13" fill="#3a6b3a"/>
      <text x="144" y="81">3</text>
    </g>
    <circle cx="48" cy="80" r="13" fill="#5b6b7d"/>
    <text x="48" y="81" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">4</text>

    <!-- 坐标：原点在左下 -->
    <circle cx="0" cy="192" r="8" fill="#F3A21C" stroke="#fff" stroke-width="2"/>
    <text x="16" y="182" font-size="10" font-weight="700" fill="#8a6a2a" font-family="ui-monospace, Menlo, monospace">(0,0)</text>
  </g>

  <!-- 右侧说明 -->
  <g transform="translate(478, 92)">
    <rect width="225" height="285" fill="#fff" stroke="#EDEDED" rx="10"/>

    <text x="16" y="26" font-size="13" font-weight="700" fill="#F3A21C">🟧 递归怎么走？</text>

    <g font-size="11.5" fill="#333">
      <text x="16" y="50" font-weight="700">① 基准情况</text>
      <text x="16" y="68" fill="#5b6b7d">问不出伴生 → 链子到头</text>
      <text x="16" y="84" fill="#5b6b7d">返回 0，停</text>

      <text x="16" y="112" font-weight="700">② 递归步骤</text>
      <text x="16" y="130" fill="#5b6b7d">种下去 → 再问下一格</text>
      <text x="16" y="146" fill="#5b6b7d">问题小了一号</text>

      <text x="16" y="174" font-weight="700">③ 返回值合并</text>
      <text x="16" y="192" fill="#5b6b7d">自己 1 株 + 后面的 n 株</text>
    </g>

    <rect x="16" y="206" width="193" height="64" rx="6" fill="#1f1f1f"/>
    <text x="26" y="226" font-size="10" fill="#e8e8e8" font-family="ui-monospace, Menlo, monospace">def chain(x, y):</text>
    <text x="26" y="242" font-size="10" fill="#7ee787" font-family="ui-monospace, Menlo, monospace">    r = get_companion()</text>
    <text x="26" y="258" font-size="10" fill="#ff7b72" font-family="ui-monospace, Menlo, monospace">    if r == None: return 0</text>

    <text x="16" y="278" font-size="10.5" fill="#a06a10" font-weight="700">一共 4 层 · 每次小一号</text>
  </g>
</svg>
