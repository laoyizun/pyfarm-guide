<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif">
  <!-- 背景 -->
  <rect width="720" height="380" fill="#fdfaf3"/>

  <!-- 标题 -->
  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#5a4a2a">订单 2 · 1×3 全田种灌木</text>
  <text x="360" y="54" text-anchor="middle" font-size="13" fill="#8a7a5a">一行 3 格，每格都是灌木，无人机在 3 格之间来回走并收草</text>

  <!-- 1×3 田 -->
  <g transform="translate(80,90)">
    <!-- 外框 -->
    <rect x="0" y="0" width="540" height="180" fill="#c8a06b" stroke="#8a6a3a" stroke-width="3" rx="6"/>

    <!-- 第 0 格 -->
    <g transform="translate(0,0)">
      <rect x="6" y="6" width="168" height="168" fill="#a08050" stroke="#7a5a30" stroke-width="1.5" rx="4"/>
      <text x="90" y="32" text-anchor="middle" font-size="12" fill="#fff8e0" font-weight="600">x = 0</text>
      <!-- 灌木丛 -->
      <circle cx="60" cy="80" r="16" fill="#6fa84a"/>
      <circle cx="90" cy="72" r="18" fill="#7fb858"/>
      <circle cx="118" cy="86" r="15" fill="#6fa84a"/>
      <circle cx="80" cy="100" r="14" fill="#84c25a"/>
      <circle cx="110" cy="108" r="12" fill="#6fa84a"/>
      <circle cx="68" cy="118" r="11" fill="#84c25a"/>
      <text x="90" y="158" text-anchor="middle" font-size="11" fill="#5a4a2a">🌿</text>
    </g>

    <!-- 第 1 格 -->
    <g transform="translate(180,0)">
      <rect x="6" y="6" width="168" height="168" fill="#a08050" stroke="#7a5a30" stroke-width="1.5" rx="4"/>
      <text x="90" y="32" text-anchor="middle" font-size="12" fill="#fff8e0" font-weight="600">x = 1</text>
      <circle cx="60" cy="80" r="16" fill="#6fa84a"/>
      <circle cx="90" cy="72" r="18" fill="#7fb858"/>
      <circle cx="118" cy="86" r="15" fill="#6fa84a"/>
      <circle cx="80" cy="100" r="14" fill="#84c25a"/>
      <circle cx="110" cy="108" r="12" fill="#6fa84a"/>
      <circle cx="68" cy="118" r="11" fill="#84c25a"/>
      <text x="90" y="158" text-anchor="middle" font-size="11" fill="#5a4a2a">🌿</text>
    </g>

    <!-- 第 2 格 -->
    <g transform="translate(360,0)">
      <rect x="6" y="6" width="168" height="168" fill="#a08050" stroke="#7a5a30" stroke-width="1.5" rx="4"/>
      <text x="90" y="32" text-anchor="middle" font-size="12" fill="#fff8e0" font-weight="600">x = 2</text>
      <circle cx="60" cy="80" r="16" fill="#6fa84a"/>
      <circle cx="90" cy="72" r="18" fill="#7fb858"/>
      <circle cx="118" cy="86" r="15" fill="#6fa84a"/>
      <circle cx="80" cy="100" r="14" fill="#84c25a"/>
      <circle cx="110" cy="108" r="12" fill="#6fa84a"/>
      <circle cx="68" cy="118" r="11" fill="#84c25a"/>
      <text x="90" y="158" text-anchor="middle" font-size="11" fill="#5a4a2a">🌿</text>
    </g>
  </g>

  <!-- 底部说明 -->
  <g transform="translate(80,300)">
    <rect x="0" y="0" width="560" height="50" fill="#fff3d6" stroke="#F3A21C" stroke-width="1" rx="6"/>
    <text x="20" y="22" font-size="13" fill="#8a6a2a">
      <tspan font-weight="700">订单要求：</tspan>
      <tspan>3 格都是灌木（<tspan font-family="ui-monospace, Menlo, monospace">Entities.Bush</tspan>），无人机在 0→1→2→1→0 之间来回走并收草。</tspan>
    </text>
    <text x="20" y="42" font-size="12" fill="#8a6a2a">
      <tspan font-weight="700">关键判断：</tspan>
      <tspan font-family="ui-monospace, Menlo, monospace">get_pos_x() == 2</tspan> 时 <tspan font-family="ui-monospace, Menlo, monospace">move(West)</tspan>，<tspan font-family="ui-monospace, Menlo, monospace">== 0</tspan> 时 <tspan font-family="ui-monospace, Menlo, monospace">move(East)</tspan>。
    </text>
  </g>
</svg>
