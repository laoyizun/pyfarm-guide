<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="720" height="420" fill="#F9FAFB"/>

  <!-- 标题 -->
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#333">S8 订单 1 · 收获篮：只能从顶上拿</text>
  <text x="360" y="57" text-anchor="middle" font-size="12.5" fill="#64748B">放进去：南瓜 → 胡萝卜 → 树　　拿出来：树 → 胡萝卜 → 南瓜（顺序反了！）</text>

  <!-- 左侧：篮子 -->
  <g transform="translate(60, 90)">
    <text x="120" y="0" font-size="14" font-weight="700" fill="#8a6a2a" text-anchor="middle">① 依次放进去</text>

    <!-- 篮子：上宽下窄的梯形 -->
    <path d="M 45 30 L 195 30 L 178 190 L 62 190 Z" fill="#C9A227" opacity="0.16" stroke="#B8860B" stroke-width="2.5"/>
    <g stroke="#B8860B" stroke-width="1.2" opacity="0.5" fill="none">
      <line x1="52" y1="62" x2="188" y2="62"/>
      <line x1="56" y1="100" x2="184" y2="100"/>
      <line x1="59" y1="138" x2="181" y2="138"/>
    </g>

    <!-- 篮里的三样东西（从上到下：树、胡萝卜、南瓜） -->
    <g text-anchor="middle" dominant-baseline="central" font-size="30">
      <text x="120" y="62">🌳</text>
      <text x="120" y="104">🥕</text>
      <text x="120" y="148">🎃</text>
    </g>

    <!-- 栈顶/栈底标注 -->
    <line x1="196" y1="62" x2="240" y2="62" stroke="#e74c3c" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="244" y="66" font-size="11.5" font-weight="700" fill="#e74c3c">栈顶（最后放进去的）</text>

    <line x1="62" y1="148" x2="30" y2="148" stroke="#3b6fb1" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="28" y="152" font-size="11.5" font-weight="700" fill="#3b6fb1" text-anchor="end">栈底（最先放的）</text>

    <text x="120" y="212" font-size="11.5" fill="#64748B" text-anchor="middle">栈里从上到下：🌳 🥕 🎃</text>
  </g>

  <!-- 右侧：取出来的顺序 -->
  <g transform="translate(430, 90)">
    <text x="120" y="0" font-size="14" font-weight="700" fill="#8a6a2a" text-anchor="middle">② 依次拿出来</text>

    <g>
      <rect x="10" y="22" width="220" height="42" rx="8" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
      <text x="30" y="43" font-size="12" font-weight="700" fill="#e74c3c" font-family="ui-monospace, Menlo, monospace">第 1 个</text>
      <text x="90" y="49" font-size="26" dominant-baseline="central">🌳</text>
      <text x="130" y="49" font-size="12.5" fill="#333" dominant-baseline="central">树</text>
    </g>
    <g>
      <rect x="10" y="76" width="220" height="42" rx="8" fill="#fff" stroke="#F3A21C" stroke-width="2"/>
      <text x="30" y="97" font-size="12" font-weight="700" fill="#a06a10" font-family="ui-monospace, Menlo, monospace">第 2 个</text>
      <text x="90" y="103" font-size="26" dominant-baseline="central">🥕</text>
      <text x="130" y="103" font-size="12.5" fill="#333" dominant-baseline="central">胡萝卜</text>
    </g>
    <g>
      <rect x="10" y="130" width="220" height="42" rx="8" fill="#fff" stroke="#3b6fb1" stroke-width="2"/>
      <text x="30" y="151" font-size="12" font-weight="700" fill="#3b6fb1" font-family="ui-monospace, Menlo, monospace">第 3 个</text>
      <text x="90" y="157" font-size="26" dominant-baseline="central">🎃</text>
      <text x="130" y="157" font-size="12.5" fill="#333" dominant-baseline="central">南瓜</text>
    </g>

    <rect x="10" y="186" width="220" height="46" rx="8" fill="#FFF8E8" stroke="#F3A21C" stroke-width="1.5"/>
    <text x="24" y="205" font-size="11.5" fill="#a06a10">放进去：南瓜 胡萝卜 树</text>
    <text x="24" y="223" font-size="11.5" fill="#a06a10">拿出来：树 胡萝卜 南瓜</text>

    <text x="120" y="252" font-size="12" font-weight="700" fill="#c25e0c" text-anchor="middle">后进先出 · 顺序完全反过来</text>
  </g>

  <!-- 底部：代码对照 -->
  <g transform="translate(60, 330)">
    <rect width="600" height="72" rx="10" fill="#1f1f1f"/>
    <text x="18" y="26" font-size="12" fill="#7ee787" font-family="ui-monospace, Menlo, monospace">stack = []</text>
    <text x="18" y="46" font-size="12" fill="#7ee787" font-family="ui-monospace, Menlo, monospace">stack.append("南瓜")   # 放第一个</text>
    <text x="18" y="64" font-size="12" fill="#7ee787" font-family="ui-monospace, Menlo, monospace">item = stack.pop()      # 拿到的却是 "树"</text>
  </g>
</svg>
