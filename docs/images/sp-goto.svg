<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="720" height="400" fill="#F9FAFB"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#333">特殊订单 2 · goto(x, y) 怎么走</text>
  <text x="360" y="55" text-anchor="middle" font-size="12.5" fill="#64748B">先横着走到目标列，再竖着走到目标行</text>

  <!-- 网格 4×4，单元格 74×74，左上 (105, 88) -->
  <g transform="translate(105, 88)">
    <rect width="296" height="296" fill="#a0c45a" rx="6"/>
    <g stroke="#5a7a2e" stroke-width="1.3" fill="none">
      <rect x="0" y="0" width="296" height="296" stroke-width="2"/>
      <line x1="74"  y1="0" x2="74"  y2="296"/>
      <line x1="148" y1="0" x2="148" y2="296"/>
      <line x1="222" y1="0" x2="222" y2="296"/>
      <line x1="0" y1="74"  x2="296" y2="74"/>
      <line x1="0" y1="148" x2="296" y2="148"/>
      <line x1="0" y1="222" x2="296" y2="222"/>
    </g>

    <!-- 起点 -->
    <circle cx="37" cy="259" r="21" fill="#F3A21C" stroke="#fff" stroke-width="3"/>
    <text x="37" y="260" font-size="19" text-anchor="middle" dominant-baseline="central">🚁</text>
    <text x="37" y="318" font-size="11" font-weight="700" fill="#a06a10" text-anchor="middle">起点 (0,0)</text>

    <!-- 终点 -->
    <circle cx="185" cy="111" r="21" fill="#10b981" stroke="#fff" stroke-width="3"/>
    <text x="185" y="112" font-size="18" text-anchor="middle" dominant-baseline="central">⭐</text>
    <text x="185" y="60" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">终点 (2,2)</text>

    <!-- 路径：先横向 (0,0)→(2,0)，再纵向 (2,0)→(2,2) -->
    <path d="M 37 259 L 185 259" fill="none" stroke="#F3A21C" stroke-width="3.5"
          stroke-dasharray="7 5" marker-end="url(#aO)"/>
    <path d="M 185 259 L 185 111" fill="none" stroke="#10b981" stroke-width="3.5"
          stroke-dasharray="7 5" marker-end="url(#aG)"/>
    <defs>
      <marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#F3A21C"/>
      </marker>
      <marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#10b981"/>
      </marker>
    </defs>

    <!-- 拐点标记 -->
    <circle cx="185" cy="259" r="6" fill="#fff" stroke="#F3A21C" stroke-width="2.5"/>

    <!-- 距离标注 -->
    <text x="111" y="278" font-size="11.5" font-weight="700" fill="#a06a10" text-anchor="middle">横向 2 步</text>
    <text x="212" y="188" font-size="11.5" font-weight="700" fill="#047857">竖向 2 步</text>

    <!-- 坐标轴 -->
    <circle cx="0" cy="296" r="8" fill="#F3A21C" stroke="#fff" stroke-width="2"/>
    <text x="13" y="300" font-size="10" font-weight="700" fill="#8a6a2a" font-family="ui-monospace, Menlo, monospace">(0,0)</text>
    <g font-size="9.5" fill="#5a7a2e" font-weight="700" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">
      <text x="37"  y="-10">x=0</text>
      <text x="111" y="-10">x=1</text>
      <text x="185" y="-10">x=2</text>
      <text x="259" y="-10">x=3</text>
    </g>
    <g font-size="9.5" fill="#5a7a2e" font-weight="700" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">
      <text x="-13" y="267">y=0</text>
      <text x="-13" y="193">y=1</text>
      <text x="-13" y="119">y=2</text>
      <text x="-13" y="45">y=3</text>
    </g>
  </g>

  <!-- 右侧说明 -->
  <g transform="translate(455, 88)">
    <rect width="245" height="296" fill="#fff" stroke="#EDEDED" rx="10"/>

    <text x="18" y="26" font-size="13" font-weight="700" fill="#F3A21C">🟧 goto 的三步</text>

    <g font-size="10.5" fill="#333">
      <text x="18" y="52" font-weight="700" fill="#F3A21C">第 1 步 · 横</text>
      <text x="26" y="70">先不管 y，只把 x 走到目标</text>
      <text x="18" y="94" font-weight="700" fill="#F3A21C">第 2 步 · 竖</text>
      <text x="26" y="112">再只管 y，竖着走上去</text>
      <text x="18" y="136" font-weight="700" fill="#F3A21C">第 3 步 · 停下</text>
      <text x="26" y="154">两个都到了，就停</text>
    </g>

    <text x="18" y="184" font-size="13" font-weight="700" fill="#F3A21C">🟧 为什么要拆两步？</text>
    <text x="18" y="204" font-size="10.5" fill="#333">如果横竖混着走，</text>
    <text x="18" y="220" font-size="10.5" fill="#333">可能会<tspan font-weight="700">绕到田外面</tspan>。</text>
    <text x="18" y="240" font-size="10.5" fill="#333">拆开就绝对不会。</text>

    <text x="18" y="268" font-size="13" font-weight="700" fill="#F3A21C">🟧 会不会走过头？</text>
    <text x="18" y="286" font-size="10.5" fill="#333">while 条件里两个都要查，</text>
  </g>
</svg>
