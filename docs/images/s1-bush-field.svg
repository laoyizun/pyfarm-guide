<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif">
  <!-- 背景 -->
  <rect width="720" height="460" fill="#fdfaf3"/>

  <!-- 标题 -->
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#5a4a2a">订单 2 · 全田种灌木 + 浇水</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#8a7a5a">3×3 田，每格都是灌木 + 自动浇水，循环往复</text>

  <!-- 3x3 田 -->
  <g transform="translate(40,90)">
    <!-- 外框 -->
    <rect x="0" y="0" width="360" height="360" fill="#c8a06b" stroke="#8a6a3a" stroke-width="3" rx="6"/>
    <!-- 9 格灌木 -->
    <g>
      <!-- 行 0 -->
      <g transform="translate(0,0)">
        <rect x="6" y="6" width="108" height="108" fill="#a08050" stroke="#7a5a30" stroke-width="1.5" rx="4"/>
        <text x="60" y="32" text-anchor="middle" font-size="11" fill="#fff8e0" font-weight="600">(0,0)</text>
        <!-- 灌木丛（3 个圆） -->
        <circle cx="40" cy="62" r="14" fill="#6fa84a"/>
        <circle cx="64" cy="56" r="16" fill="#7fb858"/>
        <circle cx="86" cy="68" r="13" fill="#6fa84a"/>
        <circle cx="58" cy="82" r="12" fill="#84c25a"/>
        <circle cx="82" cy="90" r="10" fill="#6fa84a"/>
      </g>
      <g transform="translate(120,0)">
        <rect x="6" y="6" width="108" height="108" fill="#a08050" stroke="#7a5a30" stroke-width="1.5" rx="4"/>
        <text x="60" y="32" text-anchor="middle" font-size="11" fill="#fff8e0" font-weight="600">(1,0)</text>
        <circle cx="40" cy="62" r="14" fill="#6fa84a"/>
        <circle cx="64" cy="56" r="16" fill="#7fb858"/>
        <circle cx="86" cy="68" r="13" fill="#6fa84a"/>
        <circle cx="58" cy="82" r="12" fill="#84c25a"/>
        <circle cx="82" cy="90" r="10" fill="#6fa84a"/>
      </g>
      <g transform="translate(240,0)">
        <rect x="6" y="6" width="108" height="108" fill="#a08050" stroke="#7a5a30" stroke-width="1.5" rx="4"/>
        <text x="60" y="32" text-anchor="middle" font-size="11" fill="#fff8e0" font-weight="600">(2,0)</text>
        <circle cx="40" cy="62" r="14" fill="#6fa84a"/>
        <circle cx="64" cy="56" r="16" fill="#7fb858"/>
        <circle cx="86" cy="68" r="13" fill="#6fa84a"/>
        <circle cx="58" cy="82" r="12" fill="#84c25a"/>
        <circle cx="82" cy="90" r="10" fill="#6fa84a"/>
      </g>
      <!-- 行 1 -->
      <g transform="translate(0,120)">
        <rect x="6" y="6" width="108" height="108" fill="#a08050" stroke="#7a5a30" stroke-width="1.5" rx="4"/>
        <text x="60" y="32" text-anchor="middle" font-size="11" fill="#fff8e0" font-weight="600">(0,1)</text>
        <circle cx="40" cy="62" r="14" fill="#6fa84a"/>
        <circle cx="64" cy="56" r="16" fill="#7fb858"/>
        <circle cx="86" cy="68" r="13" fill="#6fa84a"/>
        <circle cx="58" cy="82" r="12" fill="#84c25a"/>
        <circle cx="82" cy="90" r="10" fill="#6fa84a"/>
      </g>
      <g transform="translate(120,120)">
        <rect x="6" y="6" width="108" height="108" fill="#a08050" stroke="#7a5a30" stroke-width="1.5" rx="4"/>
        <text x="60" y="32" text-anchor="middle" font-size="11" fill="#fff8e0" font-weight="600">(1,1)</text>
        <circle cx="40" cy="62" r="14" fill="#6fa84a"/>
        <circle cx="64" cy="56" r="16" fill="#7fb858"/>
        <circle cx="86" cy="68" r="13" fill="#6fa84a"/>
        <circle cx="58" cy="82" r="12" fill="#84c25a"/>
        <circle cx="82" cy="90" r="10" fill="#6fa84a"/>
        <!-- 浇水水滴 -->
        <path d="M 60 50 Q 56 42, 60 36 Q 64 42, 60 50 Z" fill="#5cb0e0" stroke="#3a8fc0" stroke-width="1"/>
      </g>
      <g transform="translate(240,120)">
        <rect x="6" y="6" width="108" height="108" fill="#a08050" stroke="#7a5a30" stroke-width="1.5" rx="4"/>
        <text x="60" y="32" text-anchor="middle" font-size="11" fill="#fff8e0" font-weight="600">(2,1)</text>
        <circle cx="40" cy="62" r="14" fill="#6fa84a"/>
        <circle cx="64" cy="56" r="16" fill="#7fb858"/>
        <circle cx="86" cy="68" r="13" fill="#6fa84a"/>
        <circle cx="58" cy="82" r="12" fill="#84c25a"/>
        <circle cx="82" cy="90" r="10" fill="#6fa84a"/>
      </g>
      <!-- 行 2 -->
      <g transform="translate(0,240)">
        <rect x="6" y="6" width="108" height="108" fill="#a08050" stroke="#7a5a30" stroke-width="1.5" rx="4"/>
        <text x="60" y="32" text-anchor="middle" font-size="11" fill="#fff8e0" font-weight="600">(0,2)</text>
        <circle cx="40" cy="62" r="14" fill="#6fa84a"/>
        <circle cx="64" cy="56" r="16" fill="#7fb858"/>
        <circle cx="86" cy="68" r="13" fill="#6fa84a"/>
        <circle cx="58" cy="82" r="12" fill="#84c25a"/>
        <circle cx="82" cy="90" r="10" fill="#6fa84a"/>
      </g>
      <g transform="translate(120,240)">
        <rect x="6" y="6" width="108" height="108" fill="#a08050" stroke="#7a5a30" stroke-width="1.5" rx="4"/>
        <text x="60" y="32" text-anchor="middle" font-size="11" fill="#fff8e0" font-weight="600">(1,2)</text>
        <circle cx="40" cy="62" r="14" fill="#6fa84a"/>
        <circle cx="64" cy="56" r="16" fill="#7fb858"/>
        <circle cx="86" cy="68" r="13" fill="#6fa84a"/>
        <circle cx="58" cy="82" r="12" fill="#84c25a"/>
        <circle cx="82" cy="90" r="10" fill="#6fa84a"/>
      </g>
      <g transform="translate(240,240)">
        <rect x="6" y="6" width="108" height="108" fill="#a08050" stroke="#7a5a30" stroke-width="1.5" rx="4"/>
        <text x="60" y="32" text-anchor="middle" font-size="11" fill="#fff8e0" font-weight="600">(2,2)</text>
        <circle cx="40" cy="62" r="14" fill="#6fa84a"/>
        <circle cx="64" cy="56" r="16" fill="#7fb858"/>
        <circle cx="86" cy="68" r="13" fill="#6fa84a"/>
        <circle cx="58" cy="82" r="12" fill="#84c25a"/>
        <circle cx="82" cy="90" r="10" fill="#6fa84a"/>
      </g>
    </g>
  </g>

  <!-- 右侧说明 -->
  <g transform="translate(440,100)">
    <text x="0" y="0" font-size="15" font-weight="700" fill="#5a4a2a">每格都做这 3 件事</text>

    <g transform="translate(0,30)">
      <circle cx="10" cy="10" r="10" fill="#F3A21C"/>
      <text x="10" y="14" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
      <text x="28" y="14" font-size="14" fill="#3a2a1a" font-weight="600">能收就收</text>
      <text x="0" y="34" font-size="12" fill="#6b5a3a" font-family="ui-monospace, Menlo, monospace">if can_harvest():</text>
      <text x="14" y="50" font-size="12" fill="#6b5a3a" font-family="ui-monospace, Menlo, monospace">harvest()</text>
    </g>

    <g transform="translate(0,80)">
      <circle cx="10" cy="10" r="10" fill="#F3A21C"/>
      <text x="10" y="14" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
      <text x="28" y="14" font-size="14" fill="#3a2a1a" font-weight="600">种灌木</text>
      <text x="0" y="34" font-size="12" fill="#6b5a3a" font-family="ui-monospace, Menlo, monospace">plant(Entities.Bush)</text>
    </g>

    <g transform="translate(0,130)">
      <circle cx="10" cy="10" r="10" fill="#F3A21C"/>
      <text x="10" y="14" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
      <text x="28" y="14" font-size="14" fill="#3a2a1a" font-weight="600">缺水就浇</text>
      <text x="0" y="34" font-size="12" fill="#6b5a3a" font-family="ui-monospace, Menlo, monospace">if get_water() &lt; 0.5:</text>
      <text x="14" y="50" font-size="12" fill="#6b5a3a" font-family="ui-monospace, Menlo, monospace">use_item(Items.Water)</text>
    </g>
  </g>

  <!-- 底部提示 -->
  <g transform="translate(40,420)">
    <rect x="0" y="0" width="640" height="28" fill="#fff3d6" stroke="#F3A21C" stroke-width="1" rx="6"/>
    <text x="14" y="18" font-size="12" fill="#8a6a2a">
      <tspan font-weight="700">易错点：</tspan>
      <tspan>灌木不需要 <tspan font-family="ui-monospace, Menlo, monospace">till()</tspan>（不用翻土）；但要先 <tspan font-family="ui-monospace, Menlo, monospace">harvest()</tspan> 才能再种。</tspan>
    </text>
  </g>
</svg>
