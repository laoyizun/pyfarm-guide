<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="720" height="440" fill="#F9FAFB"/>

  <!-- 标题 -->
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#333">S4 订单 3 · 把整本心愿单翻出来看</text>
  <text x="360" y="55" text-anchor="middle" font-size="12.5" fill="#64748B">for 遍历字典 → 逐条打印 → 报总数 → 按作物统计</text>

  <!-- 左侧：心愿单 -->
  <g transform="translate(30, 80)">
    <rect width="250" height="330" fill="#fff" stroke="#EDEDED" rx="10"/>
    <text x="18" y="26" font-size="13" font-weight="700" fill="#F3A21C">companions</text>
    <text x="105" y="26" font-size="10.5" fill="#64748B">心愿单（3 条）</text>
    <line x1="18" y1="36" x2="232" y2="36" stroke="#EDEDED" stroke-width="1.5"/>

    <text x="18" y="58" font-size="10.5" fill="#8a6a2a" font-weight="700">键（在哪）</text>
    <text x="118" y="58" font-size="10.5" fill="#8a6a2a" font-weight="700">值（种什么）</text>

    <!-- 条目 1 -->
    <rect x="14" y="68" width="222" height="34" rx="6" fill="#FFF8E8"/>
    <text x="28" y="90" font-size="11.5" fill="#333" font-family="ui-monospace, Menlo, monospace">(2, 1)</text>
    <text x="128" y="90" font-size="12">🥕 胡萝卜</text>

    <!-- 条目 2 -->
    <rect x="14" y="110" width="222" height="34" rx="6" fill="#F2F8EF"/>
    <text x="28" y="132" font-size="11.5" fill="#333" font-family="ui-monospace, Menlo, monospace">(0, 3)</text>
    <text x="128" y="132" font-size="12">🌳 树</text>

    <!-- 条目 3 -->
    <rect x="14" y="152" width="222" height="34" rx="6" fill="#EFF7F7"/>
    <text x="28" y="174" font-size="11.5" fill="#333" font-family="ui-monospace, Menlo, monospace">(4, 2)</text>
    <text x="128" y="174" font-size="12">🌿 灌木</text>

    <!-- 关键提示 -->
    <rect x="14" y="200" width="222" height="60" rx="6" fill="#FDF2F0"/>
    <text x="24" y="219" font-size="10.5" font-weight="700" fill="#a04a38">⚠️ 遍历只给"键"</text>
    <text x="24" y="235" font-size="10.5" fill="#a04a38">for key in companions</text>
    <text x="24" y="250" font-size="10.5" fill="#a04a38">值要自己查：companions[key]</text>

    <!-- 无序提示 -->
    <rect x="14" y="268" width="222" height="48" rx="6" fill="#FFF8E8"/>
    <text x="24" y="287" font-size="10.5" font-weight="700" fill="#a06a10">🔀 顺序不保证</text>
    <text x="24" y="303" font-size="10.5" fill="#a06a10">打印顺序可能和写入顺序不同</text>
  </g>

  <!-- 中间箭头 -->
  <g>
    <path d="M 292 200 L 330 200" stroke="#F3A21C" stroke-width="3" marker-end="url(#arR)"/>
    <defs>
      <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#F3A21C"/>
      </marker>
    </defs>
    <text x="311" y="188" text-anchor="middle" font-size="10.5" font-weight="700" fill="#F3A21C">遍历</text>
  </g>

  <!-- 右侧：输出区 -->
  <g transform="translate(342, 80)">
    <rect width="348" height="330" fill="#1f1f1f" rx="10"/>

    <text x="18" y="26" font-size="12" font-weight="700" fill="#F3A21C">输出区</text>
    <text x="78" y="26" font-size="10.5" fill="#8a8a8a">quick_print 的结果</text>

    <!-- 逐条打印 -->
    <text x="18" y="54" font-size="10" fill="#7a7a7a">① 逐条打印（for 遍历）</text>
    <text x="18" y="76" font-size="11.5" fill="#e8e8e8" font-family="ui-monospace, Menlo, monospace">2 1 Entities.Carrot</text>
    <text x="18" y="96" font-size="11.5" fill="#e8e8e8" font-family="ui-monospace, Menlo, monospace">0 3 Entities.Tree</text>
    <text x="18" y="116" font-size="11.5" fill="#e8e8e8" font-family="ui-monospace, Menlo, monospace">4 2 Entities.Bush</text>
    <text x="240" y="76" font-size="9.5" fill="#6a6a6a">顺序可能不同</text>

    <line x1="18" y1="132" x2="330" y2="132" stroke="#3a3a3a" stroke-width="1"/>

    <!-- 总数 -->
    <text x="18" y="156" font-size="10" fill="#7a7a7a">② 报总数（len）</text>
    <text x="18" y="178" font-size="11.5" fill="#e8e8e8" font-family="ui-monospace, Menlo, monospace">心愿总数 3</text>

    <line x1="18" y1="194" x2="330" y2="194" stroke="#3a3a3a" stroke-width="1"/>

    <!-- 统计 -->
    <text x="18" y="218" font-size="10" fill="#7a7a7a">③ 统计每种作物被要了几次</text>
    <text x="18" y="240" font-size="11.5" fill="#e8e8e8" font-family="ui-monospace, Menlo, monospace">Entities.Carrot 1</text>
    <text x="18" y="260" font-size="11.5" fill="#e8e8e8" font-family="ui-monospace, Menlo, monospace">Entities.Tree 1</text>
    <text x="18" y="280" font-size="11.5" fill="#e8e8e8" font-family="ui-monospace, Menlo, monospace">Entities.Bush 1</text>

    <text x="18" y="310" font-size="9.5" fill="#6a6a6a">统计用的是另一个字典 counts：键=作物，值=次数</text>
  </g>
</svg>
