<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="720" height="470" fill="#F9FAFB"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#333">特殊订单 3 · 深度优先 vs 广度优先</text>
  <text x="360" y="55" text-anchor="middle" font-size="12.5" fill="#64748B">同一座迷宫，两种走法，访问顺序完全不同</text>

  <!-- 左：DFS -->
  <g transform="translate(30, 80)">
    <text x="160" y="0" text-anchor="middle" font-size="15" font-weight="700" fill="#e74c3c">深度优先 DFS</text>
    <text x="160" y="18" text-anchor="middle" font-size="11" fill="#64748B">一条路走到黑，不通就回头</text>

    <!-- 迷宫 5×5，格子 56 -->
    <g transform="translate(20, 30)">
      <rect width="280" height="280" fill="#8a6636" rx="4"/>
      <!-- 墙（深色块） -->
      <g fill="#4a3a20">
        <rect x="56"  y="0"  width="56" height="56"/>
        <rect x="168" y="0"  width="56" height="56"/>
        <rect x="0"   y="56" width="56" height="56"/>
        <rect x="112" y="56" width="56" height="56"/>
        <rect x="224" y="56" width="56" height="56"/>
        <rect x="56"  y="112" width="56" height="56"/>
        <rect x="168" y="112" width="56" height="56"/>
        <rect x="0"   y="168" width="56" height="56"/>
        <rect x="112" y="168" width="56" height="56"/>
        <rect x="224" y="168" width="56" height="56"/>
        <rect x="56"  y="224" width="56" height="56"/>
        <rect x="168" y="224" width="56" height="56"/>
      </g>
      <!-- 通路编号：DFS 顺序 -->
      <g font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace">
        <text x="28"  y="242" fill="#fff">1</text>
        <text x="28"  y="186" fill="#fff">2</text>
        <text x="28"  y="130" fill="#fff">3</text>
        <text x="28"  y="74"  fill="#fff">4</text>
        <text x="28"  y="18"  fill="#fff">5</text>
        <text x="84"  y="18"  fill="#fff">6</text>
        <text x="84"  y="74"  fill="#fff">7</text>
        <text x="140" y="18"  fill="#fff">8</text>
        <text x="140" y="74"  fill="#fff">9</text>
        <text x="196" y="18"  fill="#fff">10</text>
        <text x="196" y="74"  fill="#fff">11</text>
        <text x="252" y="18"  fill="#e74c3c">12</text>
      </g>
      <!-- 起点与终点 -->
      <circle cx="28" cy="242" r="13" fill="#F3A21C" stroke="#fff" stroke-width="2"/>
      <circle cx="252" cy="18" r="14" fill="#10b981" stroke="#fff" stroke-width="2"/>
      <text x="252" y="19" font-size="13" text-anchor="middle" dominant-baseline="central">⭐</text>
    </g>
    <text x="160" y="336" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e74c3c">找到宝箱要走 11 步</text>
    <text x="160" y="354" text-anchor="middle" font-size="11" fill="#64748B">但"访问过的格子数"可能比 BFS 多</text>
  </g>

  <!-- 右：BFS -->
  <g transform="translate(390, 80)">
    <text x="160" y="0" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">广度优先 BFS</text>
    <text x="160" y="18" text-anchor="middle" font-size="11" fill="#64748B">一圈一圈往外扩</text>

    <g transform="translate(20, 30)">
      <rect width="280" height="280" fill="#8a6636" rx="4"/>
      <g fill="#4a3a20">
        <rect x="56"  y="0"  width="56" height="56"/>
        <rect x="168" y="0"  width="56" height="56"/>
        <rect x="0"   y="56" width="56" height="56"/>
        <rect x="112" y="56" width="56" height="56"/>
        <rect x="224" y="56" width="56" height="56"/>
        <rect x="56"  y="112" width="56" height="56"/>
        <rect x="168" y="112" width="56" height="56"/>
        <rect x="0"   y="168" width="56" height="56"/>
        <rect x="112" y="168" width="56" height="56"/>
        <rect x="224" y="168" width="56" height="56"/>
        <rect x="56"  y="224" width="56" height="56"/>
        <rect x="168" y="224" width="56" height="56"/>
      </g>
      <!-- 通路编号：BFS 顺序（按层） -->
      <g font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace">
        <text x="28"  y="242" fill="#fff">1</text>
        <text x="28"  y="186" fill="#fff">2</text>
        <text x="28"  y="130" fill="#fff">3</text>
        <text x="28"  y="74"  fill="#fff">4</text>
        <text x="28"  y="18"  fill="#fff">5</text>
        <text x="84"  y="18"  fill="#fff">6</text>
        <text x="84"  y="74"  fill="#fff">7</text>
        <text x="140" y="18"  fill="#fff">8</text>
        <text x="140" y="74"  fill="#fff">9</text>
        <text x="196" y="18"  fill="#fff">10</text>
        <text x="196" y="74"  fill="#fff">11</text>
        <text x="252" y="18" fill="#2563eb">12</text>
      </g>
      <circle cx="28" cy="242" r="13" fill="#F3A21C" stroke="#fff" stroke-width="2"/>
      <circle cx="252" cy="18" r="14" fill="#10b981" stroke="#fff" stroke-width="2"/>
      <text x="252" y="19" font-size="13" text-anchor="middle" dominant-baseline="central">⭐</text>

      <!-- 层圈（虚线） -->
      <ellipse cx="28" cy="242" rx="34" ry="34" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.5"/>
      <ellipse cx="28" cy="242" rx="70" ry="70" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.35"/>
      <ellipse cx="28" cy="242" rx="112" ry="112" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.22"/>
    </g>
    <text x="160" y="336" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563eb">按"层"扩展，层数最少</text>
    <text x="160" y="354" text-anchor="middle" font-size="11" fill="#64748B">格子少时差别不大，格子多时差距明显</text>
  </g>

  <!-- 底部对比条 -->
  <g transform="translate(30, 450)">
    <text x="330" y="0" text-anchor="middle" font-size="11.5" fill="#333">DFS = 一条路走到黑 · BFS = 一圈一圈往外扩 · 找<tspan font-weight="700">最短步数</tspan>用 BFS，找<tspan font-weight="700">所有路径</tspan>用 DFS</text>
  </g>
</svg>
