<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="720" height="430" fill="#F9FAFB"/>

  <!-- 标题 -->
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#333">S7 订单 1 · 一生一兵：每列一个负责人</text>
  <text x="360" y="55" text-anchor="middle" font-size="12.5" fill="#64748B">位置就是任务分配 —— 生在哪，就负责哪一列</text>

  <!-- 网格 4×4，单元格 78×78，左上 (110, 85)，原点在左下角 -->
  <g transform="translate(110, 85)">
    <rect width="312" height="312" fill="#8a6636" rx="6"/>
    <g stroke="#3a2a10" stroke-width="1.3" fill="none">
      <rect x="0" y="0" width="312" height="312" stroke-width="2"/>
      <line x1="78"  y1="0" x2="78"  y2="312"/>
      <line x1="156" y1="0" x2="156" y2="312"/>
      <line x1="234" y1="0" x2="234" y2="312"/>
      <line x1="0" y1="78"  x2="312" y2="78"/>
      <line x1="0" y1="156" x2="312" y2="156"/>
      <line x1="0" y1="234" x2="312" y2="234"/>
    </g>

    <!-- 列高亮（每列一个负责人） -->
    <rect x="0"   y="0" width="78" height="312" fill="#F3A21C" opacity="0.18"/>
    <rect x="78"  y="0" width="78" height="312" fill="#3b82f6" opacity="0.16"/>
    <rect x="156" y="0" width="78" height="312" fill="#10b981" opacity="0.16"/>
    <rect x="234" y="0" width="78" height="312" fill="#8b5cf6" opacity="0.16"/>

    <!-- 每列上方一个无人机图标 + 编号 -->
    <g font-size="26" text-anchor="middle" dominant-baseline="central">
      <text x="39"  y="-22">🚁</text>
      <text x="117" y="-22">🚁</text>
      <text x="195" y="-22">🚁</text>
      <text x="273" y="-22">🚁</text>
    </g>
    <g font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">
      <text x="39"  y="14" fill="#a06a10">主</text>
      <text x="117" y="14" fill="#1d4ed8">1</text>
      <text x="195" y="14" fill="#047857">2</text>
      <text x="273" y="14" fill="#6d28d9">3</text>
    </g>

    <!-- 每列里的作物 -->
    <g font-size="22" text-anchor="middle" dominant-baseline="central" opacity="0.6">
      <text x="39"  y="117">🌱</text>
      <text x="39"  y="195">🌱</text>
      <text x="39"  y="273">🌱</text>
      <text x="117" y="117">🌱</text>
      <text x="117" y="195">🌱</text>
      <text x="117" y="273">🌱</text>
      <text x="195" y="117">🌱</text>
      <text x="195" y="195">🌱</text>
      <text x="195" y="273">🌱</text>
      <text x="273" y="117">🌱</text>
      <text x="273" y="195">🌱</text>
      <text x="273" y="273">🌱</text>
    </g>

    <!-- 主角沿底部向东走的箭头 -->
    <path d="M 0 340 L 312 340" fill="none" stroke="#F3A21C" stroke-width="3"
          stroke-dasharray="6 5" marker-end="url(#aO)"/>
    <defs>
      <marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#F3A21C"/>
      </marker>
    </defs>
    <text x="156" y="360" font-size="12" font-weight="700" fill="#a06a10" text-anchor="middle">主角一路向东 · 每走一格生一台</text>

    <!-- 坐标：原点在左下 -->
    <circle cx="0" cy="312" r="8" fill="#F3A21C" stroke="#fff" stroke-width="2"/>
    <text x="13" y="316" font-size="10" font-weight="700" fill="#8a6a2a" font-family="ui-monospace, Menlo, monospace">(0,0)</text>
    <g font-size="9.5" fill="#8a6a2a" font-weight="600" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">
      <text x="39"  y="378">x=0</text>
      <text x="117" y="378">x=1</text>
      <text x="195" y="378">x=2</text>
      <text x="273" y="378">x=3</text>
    </g>
  </g>

  <!-- 右侧说明 -->
  <g transform="translate(480, 85)">
    <rect width="220" height="300" fill="#fff" stroke="#EDEDED" rx="10"/>

    <text x="18" y="26" font-size="13" font-weight="700" fill="#F3A21C">🟧 三条关键</text>

    <text x="18" y="52" font-size="11" font-weight="700" fill="#333">① 传函数，不传结果</text>
    <rect x="18" y="58" width="184" height="20" rx="4" fill="#1f1f1f"/>
    <text x="25" y="72" font-size="9" fill="#7ee787" font-family="ui-monospace, Menlo, monospace">spawn_drone(work)  ✅</text>
    <rect x="18" y="82" width="184" height="20" rx="4" fill="#1f1f1f"/>
    <text x="25" y="96" font-size="9" fill="#ff7b72" font-family="ui-monospace, Menlo, monospace">spawn_drone(work()) ❌</text>

    <text x="18" y="124" font-size="11" font-weight="700" fill="#333">② 生完必须 move</text>
    <text x="18" y="142" font-size="10.5" fill="#64748B">否则全都挤在同一格</text>

    <text x="18" y="170" font-size="11" font-weight="700" fill="#333">③ 主角自己也在干活</text>
    <text x="18" y="188" font-size="10.5" fill="#64748B">机器不能全派出去</text>

    <text x="18" y="216" font-size="13" font-weight="700" fill="#F3A21C">🟧 上限怎么算？</text>
    <text x="18" y="236" font-size="10.5" fill="#333">max_drones() 含<tspan font-weight="700">主角自己</tspan></text>
    <text x="18" y="254" font-size="10.5" fill="#333">初始只有 <tspan font-weight="700">2</tspan> 台</text>
    <text x="18" y="272" font-size="10.5" fill="#333">满了 → 返回 None</text>
  </g>
</svg>
